services:
  trivy:
    image: aquasec/trivy:latest
    container_name: trivy
    restart: unless-stopped
    command: server --listen 0.0.0.0:4954
    ports:
      - "4954:4954"
    volumes:
      - trivy-cache:/root/.cache/trivy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4954/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  trivy-cache:
